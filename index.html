<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Olivos Store</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#F4F6F1" />
    <link rel="stylesheet" href="styles.css" />
    <script src="lib/vendor/supabase.min.js"></script>
  </head>
  <body>
    <div class="center-page">
      <div class="auth-card">
        <div class="auth-brand">
          <img class="auth-logo" src="icons/icon-192.png" alt="Olivos Store" />
          <h1>Olivos Store</h1>
          <p class="sub">Complejo Deportivo · captura y reportes de venta</p>
        </div>
        <div id="msgBox" role="status" aria-live="polite"></div>
        <form id="formLogin">
          <div class="field">
            <label for="loginEmail">Correo</label
            ><input
              type="email"
              id="loginEmail"
              required
              autocomplete="username"
            />
          </div>
          <div class="field">
            <label for="loginPassword">Contraseña</label
            ><input
              type="password"
              id="loginPassword"
              required
              autocomplete="current-password"
            />
          </div>
          <button class="btn" type="submit" id="btnLogin" style="width: 100%">
            Entrar</button
          ><button
            class="btn sec"
            type="button"
            id="btnForgot"
            style="width: 100%; margin-top: 10px"
          >
            Olvidé mi contraseña
          </button>
        </form>
        <form id="formRecovery" hidden>
          <div class="field">
            <label for="newPassword">Nueva contraseña</label
            ><input
              id="newPassword"
              type="password"
              minlength="12"
              required
              autocomplete="new-password"
            />
            <div class="hint">Usa al menos 12 caracteres.</div>
          </div>
          <div class="field">
            <label for="confirmPassword">Repite la contraseña</label
            ><input
              id="confirmPassword"
              type="password"
              minlength="12"
              required
              autocomplete="new-password"
            />
          </div>
          <button class="btn" id="btnRecover">Guardar contraseña</button>
        </form>
        <p class="footnote" style="margin-top: 18px">
          El acceso lo autoriza la administración de la tienda. Solicita una
          invitación si todavía no tienes cuenta.
        </p>
      </div>
    </div>
    <script type="module" src="lib/login.js"></script>
  </body>
</html>
